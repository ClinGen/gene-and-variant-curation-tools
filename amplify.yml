version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - npm install npm@8.5.5 -g
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: build
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
    appRoot: gci-vci-react
