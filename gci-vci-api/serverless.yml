service: gci-vci-api
# app and org for use with dashboard.serverless.com
#app: your-app-name
#org: your-org-name

frameworkVersion: '3'

plugins:
  - serverless-python-requirements
  - serverless-dynamodb-local
  - serverless-offline
  - serverless-add-api-key

provider:
  name: aws
  runtime: python3.11
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-west-2'}
  timeout: 30

custom:
  pythonRequirements:
    dockerizePip: non-linux

  dynamodb:
    stages:
      - dev

  resources:
    db_table_name: GCI-VCI-API-${self:provider.stage}

  apiKeys:
    - admin-api-key

resources:
  - ${file(./resources/apikeys-table.yml)}
  - ${file(./resources/iam.yml)}

## Include this in separate file.
functions:
  gci-vci-api:
    handler: src/handler.handler
    role: !GetAtt GciVciApiLambdaRole.Arn
    environment:
      API_DYNAMO_TABLE_NAME: ${self:custom.resources.db_table_name}
      BACKEND_FUNCTION_ARN: !Join
        - ""
        - - 'arn:aws:lambda:'
          - !Ref 'AWS::Region'
          - ':'
          - !Ref 'AWS::AccountId'
          - ':function:gci-vci-serverless-'
          - ${self:provider.stage}-gci-vci-serverless

    ## Only specifying the GET affliations endpoint for now. 
    events:
      - http:
          path: /affiliations
          method: get
          private: true
      - http:
          path: /interpretations
          method: get
          private: true
      - http:
          path: /snapshots
          method: get
          private: true
