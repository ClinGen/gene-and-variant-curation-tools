[pytest]
pythonpath = .
# Ignore tests that cause errors or otherwise prevent us from running
# Pytest. Here are the reasons for ignoring:
# tests/unit/test_kafka.py          -- errors out
# tests/unit/test_kafka_producer.py -- errors out
# tests/unit/test_kafka_single.py   -- errors out
# tests/unit/test_kafka_consumer.py -- hangs indefinitely; doesn't collect any tests
addopts = --ignore=tests/unit/test_kafka.py --ignore=tests/unit/test_kafka_producer.py --ignore=tests/unit/test_kafka_single.py --ignore=tests/unit/test_kafka_consumer.py